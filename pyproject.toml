[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "glicia"
version = "0.1.0"
description = "CLI para contagem de carboidratos assistida por IA e cálculo determinístico de bolus."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Glicia contributors" }]
keywords = ["diabetes", "carboidratos", "cli", "openai"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
]
dependencies = ["prompt-toolkit>=3.0,<4", "rich>=13.7,<16"]

[project.optional-dependencies]
dev = ["mypy>=1.13", "pre-commit>=4.0", "pytest>=8.3", "ruff>=0.8"]

[project.scripts]
glicia = "glicia.cli:main"

[project.urls]
Homepage = "https://github.com/deniojunior/glicia"
Repository = "https://github.com/deniojunior/glicia"
Issues = "https://github.com/deniojunior/glicia/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/glicia"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
check_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
