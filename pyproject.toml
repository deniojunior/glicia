[tool.pytest.ini_options]
testpaths = ["apps/cli/tests"]
pythonpath = ["apps/cli/src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["apps/cli/src"]

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
files = ["apps/cli/src"]
mypy_path = "apps/cli/src"
check_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
