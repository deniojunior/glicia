name: Relato de problema
description: Reporte um comportamento reproduzível do Glicia.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Não inclua dados pessoais, leituras reais de saúde ou chaves de API."
  - type: textarea
    id: description
    attributes:
      label: O que aconteceu?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Como reproduzir?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Versão do Glicia e Python
    validations:
      required: true
