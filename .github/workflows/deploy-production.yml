name: Promote production

on:
  release:
    types: [published]

permissions:
  contents: read
  actions: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.release.tag_name }}
      - name: Validate release tag
        run: test "$(printf '%s' "$RELEASE_TAG" | sed -E 's/^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$//')" = ""
      - name: Require a commit reachable from main
        run: git merge-base --is-ancestor "$(git rev-parse HEAD)" origin/main
      - name: Require this commit to be deployed successfully in staging
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/verify-staging-deploy.mjs "$GITHUB_REPOSITORY" "$(git rev-parse HEAD)"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/pwa/package-lock.json
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e "apps/cli[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest
      - run: npm ci
        working-directory: apps/pwa
      - run: npm run lint
        working-directory: apps/pwa
      - run: npm run typecheck
        working-directory: apps/pwa
      - run: npm test
        working-directory: apps/pwa
      - run: npm run build
        working-directory: apps/pwa

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.PUBLIC_APP_URL }}
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      PUBLIC_APP_URL: ${{ vars.PUBLIC_APP_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/pwa/package-lock.json
      - run: npm ci
        working-directory: apps/pwa
      - name: Link Supabase production
        run: npm exec -- supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD" --workdir ../..
        working-directory: apps/pwa
      - name: Validate production migrations
        run: npm run staging:check
        working-directory: apps/pwa
      - name: Deploy database
        run: npm run staging:deploy:db
        working-directory: apps/pwa
      - name: Deploy Edge Functions
        run: npm exec -- supabase functions deploy --project-ref "$SUPABASE_PROJECT_REF" --workdir ../..
        working-directory: apps/pwa
      - name: Render production Auth configuration
        run: node .github/scripts/render-supabase-config.mjs supabase/config.toml /tmp/glicia-production/supabase/config.toml "$SUPABASE_PROJECT_REF" "$PUBLIC_APP_URL"
      - name: Deploy Supabase configuration
        run: npm exec -- supabase config push --project-ref "$SUPABASE_PROJECT_REF" --workdir /tmp/glicia-production
        working-directory: apps/pwa
      - name: Run database advisors
        run: npm run staging:advisors
        working-directory: apps/pwa
      - name: Pull Vercel production configuration
        run: npx --yes vercel@59.11.7 pull --yes --environment=production --token="$VERCEL_TOKEN"
      - name: Build tagged PWA
        run: npx --yes vercel@59.11.7 build --prod --token="$VERCEL_TOKEN"
      - name: Promote tagged PWA
        run: npx --yes vercel@59.11.7 deploy --prebuilt --prod --token="$VERCEL_TOKEN"
      - name: Smoke test production
        run: node .github/scripts/smoke-pwa.mjs "$PUBLIC_APP_URL"
