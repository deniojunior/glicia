name: Deploy staging

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    environment: staging
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/pwa/package-lock.json
      - run: npm ci
        working-directory: apps/pwa
      - name: Link Supabase staging
        run: npm exec -- supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD" --workdir ../..
        working-directory: apps/pwa
      - name: Validate database changes
        run: npm run staging:check
        working-directory: apps/pwa
      - name: Deploy database
        run: npm run staging:deploy:db
        working-directory: apps/pwa
      - name: Deploy Edge Functions
        run: npm run staging:deploy:functions
        working-directory: apps/pwa
      - name: Deploy Supabase configuration
        run: npm run staging:deploy:config
        working-directory: apps/pwa
      - name: Run database advisors
        run: npm run staging:advisors
        working-directory: apps/pwa
      - name: Pull Vercel staging configuration
        run: npx --yes vercel@59.11.7 pull --yes --environment=production --token="$VERCEL_TOKEN"
      - name: Build PWA from validated commit
        run: npx --yes vercel@59.11.7 build --prod --token="$VERCEL_TOKEN"
      - name: Deploy validated PWA
        run: npx --yes vercel@59.11.7 deploy --prebuilt --prod --token="$VERCEL_TOKEN"
