name: CI

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/pwa/package-lock.json
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e "apps/cli[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest
      - run: npm ci
        working-directory: apps/pwa
      - run: npm run lint
        working-directory: apps/pwa
      - run: npm run typecheck
        working-directory: apps/pwa
      - run: npm test
        working-directory: apps/pwa
      - run: npm run build
        working-directory: apps/pwa
      - name: Check deployment scripts
        run: node --check .github/scripts/render-supabase-config.mjs && node --check .github/scripts/smoke-pwa.mjs && node --check .github/scripts/verify-staging-deploy.mjs

  supabase:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/pwa/package-lock.json
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: npm ci
        working-directory: apps/pwa
      - name: Check Edge Functions
        run: deno check functions/ai-chat/index.ts functions/delete-account/index.ts functions/request-access/index.ts functions/review-access-request/index.ts
        working-directory: supabase
      - name: Test Edge Function guardrails
        run: deno test functions/ai-chat/guardrails_test.ts
        working-directory: supabase
      - name: Start local Supabase
        run: npm run supabase:start
        working-directory: apps/pwa
      - name: Test migrations and RLS
        run: npm run supabase:test
        working-directory: apps/pwa
      - name: Stop local Supabase
        if: always()
        run: npm run supabase:stop
        working-directory: apps/pwa
