[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "glicia"
version = "0.2.0a1"
description = "CLI para contagem de carboidratos assistida por IA e cálculo determinístico de bolus."
readme = { text = "Glicia CLI: interface de terminal para contagem de carboidratos assistida por IA e cálculo determinístico local.", content-type = "text/plain" }
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Glicia contributors" }]
keywords = ["diabetes", "carboidratos", "cli", "openai"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
]
dependencies = ["prompt-toolkit>=3.0,<4", "rich>=13.7,<14"]

[project.optional-dependencies]
dev = [
  "jsonschema>=4.23,<5",
  "mypy>=1.13",
  "pre-commit>=4.0",
  "pytest>=8.3",
  "ruff>=0.8",
]

[project.scripts]
glicia = "glicia.cli:main"

[project.urls]
Homepage = "https://github.com/deniojunior/glicia"
Repository = "https://github.com/deniojunior/glicia"
Issues = "https://github.com/deniojunior/glicia/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/glicia"]
